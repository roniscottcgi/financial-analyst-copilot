name: Run Tests On Pull Request

# Trigger the workflow on pull request creation or updates
on:
  pull_request:
    types: [opened, synchronize, reopened] # Optional: these are the defaults if omitted
    branches: [ main ]           # Optional: restrict to specific target branches

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
    # 1. Fetch the pull request branch code onto the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Install the necessary runtime (Example: Node.js)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Install project dependencies
    - name: Install dependencies
      run: npm ci

    # 4. Execute the test command (Fails the job if tests fail)
    - name: Run unit tests
      run: npm test